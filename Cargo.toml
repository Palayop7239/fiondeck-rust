[package]
name = "fiondeck-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serialport = "4"
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# No wgpu: tiny-skia rasterizes on the CPU and blits with softbuffer.
# `thread-pool` is required -- iced 0.14 refuses to compile without an executor.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "thread-pool"] }
